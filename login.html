<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Login | Stackly Computers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body class="dk">
    <div class="bar2" id="prog"></div>
    <header class="nav" id="nav">
      <div class="wrap bar">
        <a class="logo" href="index.html"><img src="assets/logo/logo.webp" alt="Stackly logo"></a>
        <button class="burger" aria-label="Toggle menu" aria-expanded="false">☰</button>
        <nav id="menu" aria-label="Main">
          <div class="links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="services.html">Services</a>
            <a href="blog.html">Blog</a>
            <a href="contact.html">Contact</a>
          </div>
          <div class="acts">
            <a href="login.html">Login</a>
            <a class="btn" href="create-account.html">Create Account</a>
          </div>
        </nav>
      </div>
    </header>
    <main>
      <section class="authbg" style="background-image:linear-gradient(rgba(11,20,48,.5),rgba(11,20,48,.7)),url('assets/images/home1.webp'),url('assets/images/bg-build.webp')">
        <img class="deco float" style="left:6%;top:24%" src="assets/images/gpu.webp" alt="">
        <img class="deco float" style="right:6%;bottom:14%" src="assets/images/keyboard.webp" alt="">
        <form class="glass" data-validate novalidate data-role-login>
          <h1>Login</h1>
          <p>Welcome back to Stackly.</p>
          <div class="role-select" role="group" aria-label="Choose account type">
            <button class="btn role-choice" type="button" data-role data-dashboard="admin-dashboard.html" aria-pressed="false">Admin</button>
            <button class="btn role-choice" type="button" data-role data-dashboard="public-dashboard.html" aria-pressed="false">Public</button>
          </div>
          <div class="field">
            <label for="e">Email</label>
            <input id="e" name="e" type="text" data-v="email" autocomplete="off">
            <small class="err" role="alert"></small>
          </div>
          <div class="field">
            <label for="p">Password</label>
            <div class="pw">
              <input id="p" name="p" type="password" data-v="pass" autocomplete="off">
              <button type="button" class="eye" aria-label="Show password" data-eye>👁</button>
            </div>
            <small class="err" role="alert"></small>
          </div>
          <div class="login-options">
            <label><input type="checkbox"> Remember me</label>
            <a href="404.html">Forgot password?</a>
          </div>
          <button class="btn login-submit" type="submit">Login</button>
          <p style="margin-top:12px">New here? <a href="create-account.html"><b>Create account</b></a></p>
        </form>
      </section>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/validation.js"></script>
  </body>
</html>
